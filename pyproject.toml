[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdropout-langchain"
version = "0.1.0"
description = "AgentDropout rebuilt with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain-core==1.7.3",
  "langchain-deepseek==1.1.1",
  "langgraph==1.2.19",
  "langsmith==0.14.17",
  "python-dotenv==1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ad_l*"]
namespaces = false

[tool.setuptools.package-data]
ad_l = ["resources/*.json"]
